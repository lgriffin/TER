name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy
        run: mypy src/
      - name: Architecture import contracts
        run: lint-imports
      - name: EARS requirements and vision points lint
        run: ter-req lint --strict --tests tests
      - name: Vision points index is up to date
        run: ter-req points --check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The embeddings extra is installed, so tests marked `embeddings` must
      # run here, never skip (see conftest.py).
      TER_REQUIRE_EMBEDDINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c constraints/ci.txt -e ".[dev,embeddings]"
      - name: L0 gate (golden TER 3 parity, port contracts, architecture)
        run: python -m pytest tests/golden tests/contract tests/architecture -q
      - name: Run tests with branch coverage
        run: >-
          python -m pytest
          --cov=ter_calculator
          --cov=ter
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --req-trace=req-trace.json
      - name: Requirements traceability gate (L0)
        if: matrix.python-version == '3.11'
        run: ter-req trace --results req-trace.json --gate L0 --summary "$GITHUB_STEP_SUMMARY"
      - name: Requirements traceability gate (L1)
        if: matrix.python-version == '3.11'
        run: ter-req trace --results req-trace.json --gate L1
      - name: Requirements traceability gate (L2)
        if: matrix.python-version == '3.11'
        run: ter-req trace --results req-trace.json --gate L2
      - name: Requirements traceability gate (L3)
        if: matrix.python-version == '3.11'
        run: ter-req trace --results req-trace.json --gate L3
      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload requirements trace
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: req-trace
          path: req-trace.json

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/ter-wheel-test
          /tmp/ter-wheel-test/bin/pip install dist/*.whl
          /tmp/ter-wheel-test/bin/ter --version
          /tmp/ter-wheel-test/bin/ter --help
          /tmp/ter-wheel-test/bin/python -c "import ter_calculator; assert ter_calculator.__version__ == '3.0.0'"
          /tmp/ter-wheel-test/bin/python -c "import ter, ter.domain, ter.ports; assert ter.EVENT_SCHEMA_VERSION == 'ter.event/0.5'"
          /tmp/ter-wheel-test/bin/python -c "import importlib.resources as r; assert r.files('ter').joinpath('py.typed').is_file()"
