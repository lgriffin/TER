name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy
        run: mypy src/

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c constraints/ci.txt -e ".[dev,embeddings]"
      - name: Run tests with branch coverage
        run: >-
          python -m pytest
          --cov=ter_calculator
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-minimal:
    name: Minimal install (optional dependencies absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal dependencies
        run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Run minimal-install suite
        run: python -m pytest

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/ter-wheel-test
          /tmp/ter-wheel-test/bin/pip install dist/*.whl
          /tmp/ter-wheel-test/bin/ter --version
          /tmp/ter-wheel-test/bin/ter --help
          /tmp/ter-wheel-test/bin/python -c "import ter_calculator; assert ter_calculator.__version__ == '2.0.16'"
