<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>TER 4 maturity levels</title>
  <desc>Seven levels as a staircase. L0 Measured, L1 Observed, L2 Explained and L3 Grounded are met with passing CI gates; L4 Advisory is next; L5 Corrective and L6 Learning are planned.</desc>
  <g font-size="18" text-anchor="middle">
    <rect x="10"  y="300" width="150" height="70"  rx="8" fill="#1baf7a"/>
    <text x="85" y="330" font-weight="700" fill="#0b0b0b">L0 Measured</text>
    <text x="85" y="354" font-size="14" fill="#0b0b0b">TER 3 parity</text>
    <rect x="175" y="255" width="150" height="115" rx="8" fill="#1baf7a"/>
    <text x="250" y="285" font-weight="700" fill="#0b0b0b">L1 Observed</text>
    <text x="250" y="309" font-size="14" fill="#0b0b0b">event stream</text>
    <text x="250" y="329" font-size="14" fill="#0b0b0b">hooks · live = batch</text>
    <rect x="340" y="210" width="150" height="160" rx="8" fill="#1baf7a"/>
    <text x="415" y="240" font-weight="700" fill="#0b0b0b">L2 Explained</text>
    <text x="415" y="264" font-size="14" fill="#0b0b0b">Lean model · A3</text>
    <text x="415" y="284" font-size="14" fill="#0b0b0b">detectors · outcome</text>
    <rect x="505" y="165" width="150" height="205" rx="8" fill="#1baf7a"/>
    <text x="580" y="195" font-weight="700" fill="#0b0b0b">L3 Grounded</text>
    <text x="580" y="219" font-size="14" fill="#0b0b0b">repository evidence</text>
    <text x="580" y="239" font-size="14" fill="#0b0b0b">change surface</text>
    <text x="580" y="259" font-size="14" fill="#0b0b0b">context · routing</text>
    <rect x="670" y="120" width="150" height="250" rx="8" fill="#fff6e0" stroke="#eda100" stroke-width="2"/>
    <text x="745" y="150" font-weight="700" fill="#0b0b0b">L4 Advisory</text>
    <text x="745" y="174" font-size="14" fill="#52514e">interventions</text>
    <text x="745" y="194" font-size="14" fill="#52514e">policies · ledger</text>
    <rect x="835" y="75" width="150" height="295" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="910" y="105" font-weight="700" fill="#52514e">L5 Corrective</text>
    <text x="910" y="129" font-size="14" fill="#6f6d68">routing · opt-in fixes</text>
    <text x="910" y="149" font-size="14" fill="#6f6d68">calibration</text>
    <rect x="1000" y="30" width="150" height="340" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1075" y="60" font-weight="700" fill="#52514e">L6 Learning</text>
    <text x="1075" y="84" font-size="14" fill="#6f6d68">closed loop</text>
    <text x="1075" y="104" font-size="14" fill="#6f6d68">second harness (built)</text>
    <text x="1075" y="124" font-size="14" fill="#6f6d68">research datasets</text>
  </g>
  <g font-size="15" fill="#52514e">
    <rect x="10" y="30" width="16" height="16" rx="3" fill="#1baf7a"/><text x="34" y="44">CI gate passing</text>
    <rect x="10" y="58" width="16" height="16" rx="3" fill="#fff6e0" stroke="#eda100" stroke-width="2"/><text x="34" y="72">next</text>
    <rect x="10" y="86" width="16" height="16" rx="3" fill="#ffffff" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="4 3"/><text x="34" y="100">planned</text>
  </g>
</svg>
