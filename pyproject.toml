[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ter-calculator"
version = "3.0.0"
description = "Token Efficiency Ratio calculator for Claude Code sessions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<3",
    "rich>=13,<16",
    "tiktoken>=0.7,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2,<6",
]
llm = [
    "anthropic>=0.40,<1",
]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=4,<8",
    "pytest-bdd>=7,<9",
    "mypy>=1,<3",
    "ruff>=0.1,<0.16",
    "pre-commit>=3,<5",
    "import-linter>=2,<3",
    "types-PyYAML>=6,<7",
    "hypothesis>=6,<7",
]

[project.scripts]
ter = "ter_calculator.cli:main"
ter-req = "ter.adapters.driving.req_cli:main"

# Capabilities: adapters for TER 4 ports (ADR 0005). Keys are <Port>.<adapter>;
# this table equals ter.bootstrap.capabilities.BUILTIN_CAPABILITIES (a unit
# test keeps them equal). Other packages add capabilities in the same group.
[project.entry-points."ter.capabilities"]
"ArchitectureContracts.dependency-cruiser" = "ter.adapters.driven.dependency_cruiser:DependencyCruiserContracts"
"ArchitectureContracts.import-linter" = "ter.adapters.driven.import_linter:ImportLinterContracts"
"Embedder.hashing" = "ter.adapters.driven.embedders:HashingEmbedder"
"EventLog.jsonl" = "ter.adapters.driven.event_log:JsonlEventLog"
"OutcomeSource.junit" = "ter.adapters.driven.junit:JUnitOutcomeSource"
"PriceBook.json" = "ter.adapters.driven.pricing:JsonPriceBook"
"RepositoryEvidence.git" = "ter.adapters.driven.repository:GitRepositoryEvidence"
"RepositoryEvidence.lexical" = "ter.adapters.driven.repository:LexicalRepositoryEvidence"
"RepositoryEvidence.python-ast" = "ter.adapters.driven.repository:PythonSyntaxEvidence"
"RepositoryEvidence.syntax" = "ter.adapters.driven.repository:SourceSyntaxEvidence"
"RoutingProfiles.json" = "ter.adapters.driven.routing_profiles:JsonRoutingProfiles"
"SessionSource.claude-code" = "ter.adapters.driven.claude_code:ClaudeCodeJsonlSource"
"SessionSource.gare" = "ter.adapters.driven.gare:GareRunSource"
"TerScorer.ter3" = "ter.adapters.driven.ter3:Ter3Scorer"
"Tokenizer.regex" = "ter.adapters.driven.tokenizers:RegexTokenizer"
"Tokenizer.tiktoken" = "ter.adapters.driven.tokenizers:TiktokenTokenizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ter = ["py.typed", "data/*.json", "data/routing_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_steps.py"]
addopts = "--strict-markers"
markers = [
    "req(id): links a test to the EARS requirement it verifies (see docs/ter4)",
    "embeddings: runs the real sentence-transformers model; skipped without the embeddings extra (see conftest.py)",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Production source remains strict. Tests retain correctness checks while
# allowing compact fixture/tranche style and intentionally broad imports.
"tests/**/*.py" = ["E401", "E701", "E702", "F401", "F403", "F405", "F841"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# TER 4 code is held to strict typing from its first line.
[[tool.mypy.overrides]]
module = ["ter", "ter.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["anthropic", "sentence_transformers", "tiktoken"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ter_calculator", "ter"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

# TER 4 architecture rules, enforced by `lint-imports` in CI and by
# tests/architecture. See docs/ter4/architecture.md.
[tool.importlinter]
root_packages = ["ter", "ter_calculator"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "hexagon-layers"
name = "TER 4 hexagon: dependencies point inward"
type = "layers"
layers = [
    "ter.bootstrap",
    "ter.adapters",
    "ter.application",
    "ter.ports",
    "ter.domain",
]

[[tool.importlinter.contracts]]
id = "pure-domain"
name = "The domain is pure: no IO, no vendors, no TER 3 internals"
type = "forbidden"
source_modules = ["ter.domain"]
forbidden_modules = [
    "ter_calculator",
    "tiktoken",
    "sentence_transformers",
    "anthropic",
    "rich",
    "sqlite3",
    "subprocess",
    "socket",
    "urllib",
    "http",
    "yaml",
    "pytest",
    # External capabilities (ADR 0005): adapters read their files by schema
    # name; the core never imports their packages or their stacks.
    "gare",
    "pydantic",
    "httpx",
]

[[tool.importlinter.contracts]]
id = "vendor-free-core"
name = "Ports and use cases know no vendors and no TER 3 internals"
type = "forbidden"
source_modules = ["ter.ports", "ter.application"]
forbidden_modules = [
    "ter_calculator",
    "tiktoken",
    "sentence_transformers",
    "anthropic",
    "rich",
    "sqlite3",
    "yaml",
    "pytest",
    # External capabilities (ADR 0005), as in pure-domain.
    "gare",
    "pydantic",
    "httpx",
]

[[tool.importlinter.contracts]]
id = "report-renderers"
name = "Report renderers read only the view-model, never TER 3 results"
type = "forbidden"
source_modules = [
    "ter.adapters.driving.reports.palette",
    "ter.adapters.driving.reports.svg",
    "ter.adapters.driving.reports.html",
    "ter.adapters.driving.reports.a3",
]
forbidden_modules = ["ter_calculator"]

[[tool.importlinter.contracts]]
id = "behaviour-blind-to-outcome"
name = "No behaviour measure reads the outcome verdict (point 5)"
type = "forbidden"
# Measurement of agent behaviour and judgement of the result stay apart: the
# modules that compute behaviour never import ter.domain.outcome. Reports (the
# A3 view-model) and use cases show the verdict beside the measures.
source_modules = [
    "ter.domain.events",
    "ter.domain.pricing",
    "ter.domain.report",
    "ter.domain.scoring",
    "ter.domain.stream",
    "ter.domain.lean.analysis",
    "ter.domain.lean.countermeasures",
    "ter.domain.lean.detectors",
    "ter.domain.lean.facts",
    "ter.domain.lean.graph",
    "ter.domain.lean.model",
    "ter.domain.lean.steps",
    "ter.domain.lean.wip",
    "ter.domain.lean.concepts",
]
forbidden_modules = ["ter.domain.outcome"]

[[tool.importlinter.contracts]]
id = "independent-adapters"
name = "Driven adapters do not import each other"
type = "independence"
modules = [
    "ter.adapters.driven.claude_code",
    "ter.adapters.driven.critical_evidence",
    "ter.adapters.driven.embedders",
    "ter.adapters.driven.gare",
    "ter.adapters.driven.event_log",
    "ter.adapters.driven.tokenizers",
    "ter.adapters.driven.dependency_cruiser",
    "ter.adapters.driven.import_linter",
    "ter.adapters.driven.in_memory",
    "ter.adapters.driven.junit",
    "ter.adapters.driven.pricing",
    "ter.adapters.driven.repository",
    "ter.adapters.driven.requirements_yaml",
    "ter.adapters.driven.routing_profiles",
    "ter.adapters.driven.ter3",
]
# TER 3 sits outside the hexagon and reads its prices through the pricing
# adapter. A chain that passes through TER 3 is not one adapter depending on
# another, so those edges are exempt here (and only here).
ignore_imports = ["ter_calculator.** -> ter.adapters.driven.pricing"]

[[tool.importlinter.contracts]]
id = "provider-neutral-evidence"
name = "Repository evidence depends on no model provider (P054, TER-EVD-001)"
type = "forbidden"
# The evidence values and every repository engine import no model SDK,
# tokenizer, embedder, TER 3 internals or external capability stack: what a
# repository says never depends on which model reads it.
source_modules = ["ter.domain.repository", "ter.adapters.driven.repository"]
forbidden_modules = [
    "ter_calculator",
    "tiktoken",
    "sentence_transformers",
    "anthropic",
    "gare",
    "pydantic",
    "httpx",
    "ter.adapters.driven.embedders",
    "ter.adapters.driven.tokenizers",
]

[[tool.importlinter.contracts]]
id = "ter3-uses-hexagon-edges"
name = "TER 3 uses TER 4 only through domain, ports or adapters, never bootstrap"
type = "forbidden"
source_modules = ["ter_calculator"]
forbidden_modules = ["ter.bootstrap", "ter.application"]
# The TER 3 `ter` command hands `ter a3` and `ter explain` to the TER 4
# command line, whose services only the composition root builds. That one
# lazy delegation in the TER 3 CLI entry point is exempt (and only it).
ignore_imports = ["ter_calculator.cli -> ter.bootstrap"]
