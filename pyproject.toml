[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ter-calculator"
version = "2.0.14"
description = "Token Efficiency Ratio calculator for Claude Code sessions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<3",
    "rich>=13,<16",
    "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2,<6",
]
llm = [
    "anthropic>=0.40,<1",
]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=4,<8",
    "pytest-bdd>=7,<9",
    "mypy>=1,<3",
    "ruff>=0.1,<1",
    "pre-commit>=3,<5",
]

[project.scripts]
ter = "ter_calculator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_steps.py"]
addopts = "--strict-markers"

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Production source remains strict. Tests retain correctness checks while
# allowing compact fixture/tranche style and intentionally broad imports.
"tests/**/*.py" = ["E401", "E701", "E702", "F401", "F403", "F405", "F841"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["anthropic", "sentence_transformers", "tiktoken", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ter_calculator"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"
