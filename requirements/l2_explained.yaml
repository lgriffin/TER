# L2 Explained: the Lean model, detectors, intent, scorecard, evidence and confidence.
# Schema and controls: docs/ter4/requirements.md. Links to vision points are
# checked both ways against requirements/points.yaml.
level: L2
requirements:
  - id: TER-ANL-012
    pattern: ubiquitous
    text: >-
      The TER scorer shall return a TER value between 0 and 1 with the name
      of its scoring method, and the same value on every call for the same
      session.
    level: L2
    port: TerScorer
    source_points: [4]
    rationale: >-
      The L2 scorecard keeps TER as a foundational measure; a bounded,
      repeatable, named score keeps it comparable with TER 3.
    status: verified

  - id: TER-ANL-020
    pattern: event-driven
    text: >-
      When TER classifies a span as avoidable waste, TER shall attach at
      least one evidence reference and a confidence value between 0 and 1 to
      the classification.
    level: L2
    source_points: [40]
    rationale: >-
      A waste claim without evidence cannot be checked or acted on.
    status: verified

  - id: TER-ANL-021
    pattern: unwanted
    text: >-
      If the confidence of a waste classification is below the configured
      confidence threshold, then TER shall report the classification as
      uncertain.
    level: L2
    source_points: [85, 86]
    rationale: >-
      Low-confidence findings are shown as such instead of being presented
      as fact.
    status: verified

  - id: TER-ANL-022
    pattern: unwanted
    text: >-
      If a waste finding is uncertain, then TER shall count its share in the
      scorecard's waste tokens, waste findings and flow efficiency, and
      report that share separately as uncertain.
    level: L2
    source_points: [86]
    rationale: >-
      Uncertain waste is waste until verified (ADR 0006): on the first judged
      sample most uncertain findings were waste, so leaving them out
      understated waste, while the separate count keeps them from being read
      as fact.
    status: verified

  - id: TER-ANL-040
    pattern: event-driven
    text: >-
      When TER prices a session, TER shall use the price book whose date is
      the latest that is not after the session date.
    level: L2
    source_points: [35, 36]
    rationale: >-
      Issue #40: prices change; a session is valued at the prices in force
      when it ran.
    status: verified

  - id: TER-ANL-041
    pattern: unwanted
    text: >-
      If a session has no cache usage fields, then TER shall mark its cost
      figures as estimated.
    level: L2
    source_points: [35, 36]
    rationale: >-
      Issue #40: cache pricing decides which re-reads are expensive; without
      it costs are estimates.
    status: verified

  - id: TER-ARC-002
    pattern: ubiquitous
    text: >-
      TER shall load analysers, waste detectors and agent adapters through
      the ter.capabilities plugin registry.
    level: L2
    source_points: [197]
    rationale: >-
      Plugins let the platform grow without changing the core. Analysers
      are session scorers (TerScorer), waste detectors are WasteDetector
      capabilities run beside the built-in catalogue, and agent adapters are
      SessionSource capabilities that claim the files they read. Repository
      engines (TER-ARC-007, L3) and policies (TER-ARC-008, L4) join the same
      registry when their levels exist.
    status: verified

  - id: TER-ARC-004
    pattern: event-driven
    text: >-
      When a use case asks for an adapter of a port by name, TER shall
      resolve the adapter from the built-in adapters and the installed
      ter.capabilities entry points, keyed by port name and adapter name.
    level: L2
    source_points: [197]
    rationale: >-
      ADR 0005: installing a capability pack is what turns its adapter on,
      and the core never imports the pack's package.
    status: verified

  - id: TER-ARC-005
    pattern: unwanted
    text: >-
      If a registered capability fails to load, does not satisfy its port or
      conflicts with a built-in adapter, then TER shall report the capability
      with the reason and keep every other capability available.
    level: L2
    source_points: [197]
    rationale: >-
      One broken plugin must not stop TER, and a plugin must not silently
      replace one of TER's own adapters.
    status: verified

  - id: TER-ARC-006
    pattern: ubiquitous
    text: >-
      TER shall import the module of a capability only on the first request
      for that capability, without scanning installed packages for a
      built-in adapter.
    level: L2
    source_points: [197]
    rationale: >-
      Hooks run on every agent event; discovery and heavy adapters cost
      nothing until a use case needs them.
    status: verified

  - id: TER-DET-001
    pattern: event-driven
    text: >-
      When a detector reports a waste finding, the detector shall cite the
      ids of the events that show the waste.
    level: L2
    source_points: [40]
    rationale: >-
      Every waste classification is traceable to observable evidence.
    status: verified

  - id: TER-DET-002
    pattern: event-driven
    text: >-
      When an event repeats an earlier event of the same kind at or above
      the configured similarity threshold with no new evidence, TER shall
      report a repetition waste finding.
    level: L2
    source_points: [17, 18, 19, 20]
    rationale: >-
      Repeated reasoning, exploration, tool calls and regeneration share one
      detection rule.
    status: verified

  - id: TER-DET-003
    pattern: event-driven
    text: >-
      When the context acquired before an edit falls outside the configured
      band for the task, TER shall report an excessive or insufficient
      context finding.
    level: L2
    source_points: [21, 22]
    rationale: >-
      Both too much and too little context acquisition are waste or defect
      sources.
    status: verified

  - id: TER-DET-004
    pattern: ubiquitous
    text: >-
      TER shall report the tokens of retrieved context that no later event
      uses and the tokens of context read more than once.
    level: L2
    source_points: [34, 35, 36]
    rationale: >-
      Unused and re-read context is inventory with a measurable carrying
      cost.
    status: verified

  - id: TER-DET-005
    pattern: event-driven
    text: >-
      When the order or length of planning, implementation and validation
      phases breaks a configured phase rule, TER shall report a
      phase-sequence finding that names the broken rule.
    level: L2
    source_points: [23, 24, 25]
    rationale: >-
      Premature implementation, endless planning and unvalidated
      implementation are sequence faults.
    status: verified

  - id: TER-DET-006
    pattern: event-driven
    text: >-
      When an edit, test and failure cycle repeats on the same change
      surface, TER shall classify the repeated cycle as rework.
    level: L2
    source_points: [26, 37]
    rationale: >-
      Rework must be told apart from productive iteration.
    status: verified

  - id: TER-DET-007
    pattern: ubiquitous
    text: >-
      TER shall report fragmented edits to one logical change and file
      traversals that no later event uses as motion waste.
    level: L2
    source_points: [27, 28]
    rationale: >-
      Motion waste in agents is traversal and fragmentation without
      downstream use.
    status: verified

  - id: TER-DET-008
    pattern: ubiquitous
    text: >-
      TER shall report subagent handoffs whose work the agent then does
      itself and model calls that fail over to another route as waiting
      that added no new evidence.
    level: L2
    source_points: [29, 30]
    rationale: >-
      Handoffs and escalations create queues; only evidence justifies them.
      A failover is the escalation the event stream shows (route.failover,
      ter.event/0.3); an escalation after a successful call needs a
      route.escalated event and is TER-DET-011 (L3).
    status: verified

  - id: TER-DET-009
    pattern: event-driven
    text: >-
      When TER classifies an exploration event, TER shall label it
      uncertainty-driven only if it addresses an open question recorded in
      the session.
    level: L2
    source_points: [38]
    rationale: >-
      Exploration required by uncertainty is value; aimless exploration is
      waste.
    status: verified

  - id: TER-DET-010
    pattern: unwanted
    text: >-
      If a validation step repeats an earlier validation with no intervening
      change, then TER shall classify the repeat as duplicated validation.
    level: L2
    source_points: [39]
    rationale: >-
      Validation is valuable once per change; repeats add no information.
    status: verified

  - id: TER-EXP-001
    pattern: ubiquitous
    text: >-
      TER shall recompute every metric of its stream report and A3 report,
      other than the TER 3 ratio and the outcome verdict, from the recorded
      events of the session and the price book, with no other input.
    level: L2
    source_points: [195, 196]
    rationale: >-
      Every number in a report is reproducible and explainable from the
      event stream alone. The TER 3 ratio is computed from the source
      session and the outcome verdict from outcome evidence; recording both
      as events is TER-EXP-002 (L3). The price book is shared reference
      data, not session input.
    status: verified

  - id: TER-FLW-001
    pattern: ubiquitous
    text: >-
      TER shall report Agentic Flow Efficiency as the share of session time
      and tokens spent progressing or recovering rather than waiting,
      repeating, reworking or holding unused context.
    level: L2
    source_points: [79, 80]
    rationale: >-
      Flow efficiency is the Lean measure of how much of the session moved
      the work forward. Recovering (a fix whose next run passes or fails
      differently) is productive iteration and counts as flow (ADR 0004).
    status: verified

  - id: TER-ITN-001
    pattern: ubiquitous
    text: >-
      TER shall keep one persistent intent record per session, updated by
      every intent.stated event.
    level: L2
    source_points: [45, 46]
    rationale: >-
      Intent is a first-class, evolving object rather than the first prompt.
    status: verified

  - id: TER-ITN-002
    pattern: event-driven
    text: >-
      When the user states a goal that differs from the current intent, TER
      shall record an intent change with the prompt that caused it.
    level: L2
    source_points: [47]
    rationale: >-
      Explicit intent changes reset what counts as value.
    status: verified

  - id: TER-ITN-003
    pattern: unwanted
    text: >-
      If an agent edit or write departs from the current intent without a
      recorded intent change, then TER shall classify the departure as drift.
    level: L2
    source_points: [48]
    rationale: >-
      Drift is departure without the user's say-so. At L2 only changes to
      the software are judged; departures in exploration and reasoning are
      reported as low alignment (TER-ITN-005) until repository evidence can
      tell relevant exploration from drift (TER-ITN-006).
    status: verified

  - id: TER-ITN-004
    pattern: ubiquitous
    text: >-
      TER shall compute an alignment score between each agent event and the
      current intent.
    level: L2
    source_points: [49]
    rationale: >-
      Distance to intent is the basic alignment signal.
    status: verified

  - id: TER-ITN-005
    pattern: state-driven
    text: >-
      While the alignment score stays below the configured threshold for the
      configured number of events, TER shall report a low-alignment period.
    level: L2
    source_points: [50]
    rationale: >-
      Sustained low alignment matters more than a single off-topic event.
    status: verified

  - id: TER-LEN-001
    pattern: ubiquitous
    text: >-
      TER shall classify every scored event as value-adding, necessary
      non-value-adding or avoidable.
    level: L2
    source_points: [1, 11, 15]
    rationale: >-
      The three Lean activity classes are the base of every other Lean
      measure.
    status: verified

  - id: TER-LEN-002
    pattern: ubiquitous
    text: >-
      TER shall report the token share and time share of each activity class
      for every session.
    level: L2
    source_points: [3, 16]
    rationale: >-
      Shares make the Lean classification comparable across sessions.
    status: verified

  - id: TER-LEN-003
    pattern: ubiquitous
    text: >-
      TER shall judge the value of each agent edit and write against the
      software outcome stated in the current intent.
    level: L2
    source_points: [6, 7]
    rationale: >-
      Value is defined by the developer's requested outcome, not by activity
      volume. At L2 a change that departs from the intent loses its
      value-adding class through a drift finding; judging exploration,
      reasoning and validation against the outcome needs repository
      evidence (TER-LEN-009).
    status: verified

  - id: TER-LEN-004
    pattern: unwanted
    text: >-
      If a reasoning span adds new evidence or a new decision, then TER
      shall not classify that span as waste.
    level: L2
    source_points: [8, 17]
    rationale: >-
      Additional reasoning is not automatically waste.
    status: verified

  - id: TER-LEN-005
    pattern: ubiquitous
    text: >-
      TER shall base every efficiency judgement on value delivered per unit
      of resource, never on token count alone.
    level: L2
    source_points: [9, 10]
    rationale: >-
      Fewer tokens are not automatically more efficient; delivery is the
      goal.
    status: verified

  - id: TER-LEN-006
    pattern: ubiquitous
    text: >-
      TER shall map each Lean concept of value, flow, pull, WIP, queues,
      rework, defects, waiting, over-processing and motion to named
      agent-behaviour measures.
    level: L2
    source_points: [11, 12]
    rationale: >-
      A formal Lean model needs an explicit mapping from each concept to
      something measurable.
    status: verified

  - id: TER-LEN-007
    pattern: ubiquitous
    text: >-
      TER shall model each session as an Agentic Value Stream of events from
      stated intent to verified software change.
    level: L2
    source_points: [1, 2, 13, 14]
    rationale: >-
      The session is a development process, not a token sequence.
    status: verified

  - id: TER-LEN-008
    pattern: ubiquitous
    text: >-
      TER shall produce the same explanation, scorecard and A3 report every
      time it explains the same event stream.
    level: L2
    source_points: [195]
    rationale: >-
      A deterministic explanation can be frozen in golden snapshots and
      recomputed from the recorded events.
    status: verified

  - id: TER-RPT-001
    pattern: ubiquitous
    text: >-
      The report mapper shall carry the TER value, token composition, phase
      scores, waste patterns and 95 percent TER interval of every analysed
      session into the session report view-model.
    level: L2
    source_points: [85, 86]
    rationale: >-
      Renderers read one format-neutral view-model, so every chart and page
      shows the same numbers, uncertainty included.
    status: verified

  - id: TER-RPT-002
    pattern: ubiquitous
    text: >-
      The HTML report renderer shall render each session report as one
      self-contained HTML file with no scripts and no external resources
      that shows the 95 percent TER interval and the count of
      low-confidence tokens.
    level: L2
    source_points: [85, 86]
    rationale: >-
      A report that can be attached to a ticket or opened offline, and that
      states its uncertainty, keeps estimates from being read as facts.
    status: verified

  - id: TER-RPT-003
    pattern: event-driven
    text: >-
      When the A3 command runs on a session, the A3 command shall write one
      A3 report as HTML and JSON from one view-model, with background,
      current state, analysis, root causes, countermeasures and follow-up
      sections.
    level: L2
    source_points: [13, 80]
    rationale: >-
      The A3 shows the value stream as ordered stages and the flow split by
      tokens and time, in the problem-solving order teams already know.
    status: verified

  - id: TER-RPT-004
    pattern: ubiquitous
    text: >-
      The A3 renderer shall render each A3 report as one self-contained HTML
      file with no scripts and no external resources, in which every chart
      has a title and a description and all session text is escaped.
    level: L2
    source_points: [13, 80]
    rationale: >-
      The A3 is attached to tickets and opened offline; accessible charts
      and escaped session text keep it readable and safe.
    status: verified

  - id: TER-RPT-005
    pattern: ubiquitous
    text: >-
      TER shall derive every A3 countermeasure from a finding of the
      analysed session.
    level: L2
    source_points: [139]
    rationale: >-
      A recommendation that no finding supports, for example one triggered
      by a token count alone, cannot be explained or checked.
    status: verified

  - id: TER-RPT-006
    pattern: ubiquitous
    text: >-
      The A3 renderer shall open each A3 report with a summary that lists the
      countermeasures to act on first, in priority order, and link each
      shown finding to the countermeasure that answers it and each
      countermeasure to the findings it answers.
    level: L2
    source_points: [85]
    rationale: >-
      The A3 exists to change the next run. A reader who sees the actions
      first, each tied to the findings and confidence it rests on, can act
      without reading the whole sheet and can check why each action is there.
    status: verified

  - id: TER-SCR-001
    pattern: ubiquitous
    text: >-
      TER shall report efficiency, flow, quality, cost, risk and outcome as
      separate scorecard dimensions.
    level: L2
    source_points: [3, 5, 82, 83]
    rationale: >-
      A multidimensional scorecard avoids one opaque score and keeps
      measurement apart from outcome judgement.
    status: verified

  - id: TER-SCR-002
    pattern: optional
    text: >-
      Where the scorecard shows an aggregate indicator, TER shall show the
      weight and value of every dimension that forms it.
    level: L2
    source_points: [84]
    rationale: >-
      An aggregate is allowed only when its composition stays explainable.
    status: verified

  - id: TER-SCR-003
    pattern: ubiquitous
    text: >-
      TER shall report Software Value Efficiency next to the Token
      Efficiency Ratio in every session scorecard.
    level: L2
    source_points: [4, 81]
    rationale: >-
      TER remains the foundation; value efficiency adds the outcome view.
    status: verified

  - id: TER-SCR-004
    pattern: optional
    text: >-
      Where outcome evidence is supplied, TER shall show the outcome verdict
      beside the scorecard without changing any behaviour measure.
    level: L2
    source_points: [3, 5, 83]
    rationale: >-
      Outcome is its own dimension: it sits next to the measures of agent
      behaviour and never alters them.
    status: verified

  - id: TER-SCR-005
    pattern: ubiquitous
    text: >-
      TER shall compute every behaviour measure without reading the outcome
      verdict.
    level: L2
    source_points: [5]
    rationale: >-
      Point 5 separates measuring behaviour from judging the result; an
      import contract keeps the behaviour modules blind to ter.domain.outcome.
    status: verified

  - id: TER-SCR-006
    pattern: optional
    text: >-
      Where an outcome verdict is shown, TER shall report the generated
      tokens per accepted outcome, with no figure when no outcome is
      accepted.
    level: L2
    source_points: [83]
    rationale: >-
      Tokens per verified outcome joins cost and outcome without folding the
      verdict into a behaviour measure.
    status: verified

  - id: TER-OUT-001
    pattern: ubiquitous
    text: >-
      The outcome source shall return equal evidence on every call for the
      same run reference, with one check result per recorded result in
      record order, each keeping its recorded status.
    level: L2
    port: OutcomeSource
    source_points: [5]
    rationale: >-
      Outcome evidence is replayable and complete: failing, erroring and
      skipped results are never dropped.
    status: verified

  - id: TER-OUT-002
    pattern: unwanted
    text: >-
      If no outcome is recorded for a run reference, then the outcome source
      shall return no outcome instead of failing evidence.
    level: L2
    port: OutcomeSource
    source_points: [5]
    rationale: >-
      A missing outcome is unknown, not a failure; reading it as one would
      bias every comparison against runs without recorded checks.
    status: verified

  - id: TER-OUT-003
    pattern: unwanted
    text: >-
      If an outcome record exists but cannot be read, then the outcome source
      shall raise an outcome format error that names the record.
    level: L2
    port: OutcomeSource
    source_points: [5]
    rationale: >-
      An unreadable record must not pass silently as no outcome.
    status: verified

  - id: TER-OUT-004
    pattern: event-driven
    text: >-
      When TER judges outcome evidence against an acceptance contract, TER
      shall return a verdict of accepted, rejected or incomplete together
      with the evidence of every check, without a weighted outcome score.
    level: L2
    source_points: [5, 82]
    rationale: >-
      Hand-set outcome weights hide which check decided the result; a
      verdict with per-check evidence stays explainable.
    status: verified

  - id: TER-OUT-005
    pattern: unwanted
    text: >-
      If a required check of the acceptance contract has failing evidence,
      then TER shall judge the outcome rejected.
    level: L2
    source_points: [5]
    rationale: >-
      One failed required check is enough to refuse the change, whatever
      else passed.
    status: verified

  - id: TER-OUT-006
    pattern: unwanted
    text: >-
      If a required check of the acceptance contract has neither failing nor
      passing evidence, then TER shall judge the outcome incomplete.
    level: L2
    source_points: [5]
    rationale: >-
      A check that was skipped or never run proves nothing; accepting it
      would claim an outcome nobody verified.
    status: verified

  - id: TER-OUT-007
    pattern: event-driven
    text: >-
      When the JUnit outcome source reads a test result file, the JUnit
      outcome source shall map each testcase to one check result of passed,
      failed, error or skipped.
    level: L2
    port: OutcomeSource
    source_points: [5]
    rationale: >-
      JUnit XML is what pytest and most test runners write, so the reference
      outcome adapter depends on no agent harness.
    status: verified

  - id: TER-OUT-008
    pattern: unwanted
    text: >-
      If a test result file declares a document type or an entity, then the
      JUnit outcome source shall reject the file without expanding any
      entity.
    level: L2
    port: OutcomeSource
    source_points: [5]
    rationale: >-
      Test results come from outside TER; refusing DTDs blocks entity
      expansion and external fetches without a defusedxml dependency.
    status: verified

  - id: TER-WIP-001
    pattern: ubiquitous
    text: >-
      TER shall report, after every event, the number of unresolved
      hypotheses, tasks, edits and failures in the session.
    level: L2
    source_points: [31, 32]
    rationale: >-
      WIP is measurable in agent sessions and is a candidate predictor of
      inefficiency.
    status: verified

  # Process control (point 201): XmR control charts over sessions.
  - id: TER-SPC-001
    pattern: ubiquitous
    text: >-
      TER shall compute the natural process limits of each control measure
      as the mean of the baseline sessions plus or minus 2.66 average moving
      ranges, or 3.145 median moving ranges when the median method is
      chosen, reporting no limit beyond the measure's natural boundary.
    level: L2
    source_points: [201]
    rationale: >-
      The individuals and moving range chart is the Lean chart for one value
      per unit of work; limits come from the process, not from a target.
    status: verified

  - id: TER-SPC-002
    pattern: unwanted
    text: >-
      If a control measure has fewer than 8 baseline sessions, then TER shall
      compute no limits for that measure.
    level: L2
    source_points: [201]
    rationale: >-
      Limits from a handful of sessions describe nothing yet.
    status: verified

  - id: TER-SPC-012
    pattern: unwanted
    text: >-
      If control limits come from fewer than 20 baseline sessions, then TER
      shall mark them as provisional.
    level: L2
    source_points: [201]
    rationale: >-
      Limits from few sessions move with every new session; saying so stops
      a developer from acting on noise.
    status: verified

  - id: TER-SPC-003
    pattern: event-driven
    text: >-
      When TER charts sessions in process order, TER shall raise a control
      signal for every enabled detection rule a session completes (one
      session beyond a limit, two of three beyond two sigma, four of five
      beyond one sigma, eight on one side of the centre line), citing every
      session that forms the pattern.
    level: L2
    source_points: [201]
    rationale: >-
      Published, named rules make a special cause checkable; the cited
      sessions are the evidence behind each signal.
    status: verified

  - id: TER-SPC-004
    pattern: optional
    text: >-
      Where a developer has tuned a control limit, TER shall test the
      beyond-limits rule against the tuned limit, test the other rules
      against the natural centre and sigma, and keep both limits in the
      limits document.
    level: L2
    port: ControlLimitsSource
    source_points: [201]
    rationale: >-
      A tuned action limit is a developer's decision; the natural limits
      still describe the process, so neither may hide the other.
    status: verified

  - id: TER-SPC-005
    pattern: unwanted
    text: >-
      If a limits document has a tuned limit without a reason, a tuned lower
      limit that is not below the tuned upper limit, or an unknown measure
      or rule, then TER shall reject the whole document.
    level: L2
    port: ControlLimitsSource
    source_points: [201]
    rationale: >-
      Limits will later decide when advice fires; a half-read or unexplained
      limit must never be used.
    status: verified

  - id: TER-SPC-006
    pattern: unwanted
    text: >-
      If a control signal moves the favourable way, or its measure counts
      tokens or seconds, then TER shall mark the signal as not firing.
    level: L2
    source_points: [201, 162]
    rationale: >-
      Only an unfavourable signal on a structural measure may later drive an
      intervention; no intervention rests on a token count alone
      (TER-INT-007).
    status: verified

  - id: TER-SPC-007
    pattern: unwanted
    text: >-
      If control limits were computed with a different detector set from
      the sessions being charted, then TER shall report the limits as stale.
    level: L2
    source_points: [201]
    rationale: >-
      A recalibrated detector changes what a finding count means, so limits
      from the old detector set no longer describe the process.
    status: verified

  - id: TER-SPC-013
    pattern: unwanted
    text: >-
      If the sessions given for limits or a chart were measured with
      different detector sets, then TER shall refuse them.
    level: L2
    source_points: [201]
    rationale: >-
      One chart mixing two detector sets would show a recalibration as a
      change in the process.
    status: verified

  - id: TER-SPC-014
    pattern: state-driven
    text: >-
      While the median moving range of a measure's baseline is zero, TER
      shall compute that measure's limits from the average moving range and
      record the method used.
    level: L2
    source_points: [201]
    rationale: >-
      On the owner's corpus most finding counts are 0 in most sessions, so
      the median moving range is 0 and the median method collapsed the
      limits onto the centre, flagging every session.
    status: verified

  - id: TER-SPC-008
    pattern: event-driven
    text: >-
      When TER recomputes control limits with earlier limits kept, TER shall
      carry over every measure's tuned limits, rule selection and enabled
      flag.
    level: L2
    source_points: [201]
    rationale: >-
      Recomputing the baseline as sessions accumulate must never discard a
      developer's tuning.
    status: verified

  - id: TER-SPC-009
    pattern: ubiquitous
    text: >-
      TER shall write session control measures with no prompt, path or code
      content, and with every session id replaced by a hash when
      pseudonymisation is asked for.
    level: L2
    source_points: [201]
    rationale: >-
      Baselines are computed where the private sessions are; only the
      content-free measures need to travel.
    status: verified

  - id: TER-SPC-010
    pattern: ubiquitous
    text: >-
      TER shall render each charted measure as an individuals chart above
      its moving range chart, showing the centre line, the natural limits,
      any tuned limit and every signal with its rule.
    level: L2
    source_points: [201]
    rationale: >-
      The chart is how a developer sees routine variation and special
      causes at a glance.
    status: verified

  - id: TER-SPC-011
    pattern: optional
    text: >-
      Where control limits are supplied to the A3, TER shall place each
      control measure of the session against its limits and link every
      beyond-limits signal to the findings behind that measure.
    level: L2
    source_points: [201]
    rationale: >-
      The A3 is where a developer acts; a session outside its process's
      limits is a reason to read its root causes first.
    status: planned
