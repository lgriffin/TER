# Leigh's 200-point TER 4 vision: definition of done, enforcing rules and
# verification for every point. Checked by `ter-req lint` (see
# docs/ter4/requirements.md); docs/ter4/points.md is generated from this file
# by `ter-req points`.
#
# verification entries: 'test: <pytest node id>', 'ci: <CI step name>',
# 'branch: <branch> <what>' (proof on an unmerged branch) or 'planned: <what>'.
#
# issue / real_data: points that need real session data link the GitHub issue
# that collects it (#34 to #46, tracked in #47). A real_data point cannot be
# done until real_data_verified: true is set in the change that closes it.
#
# origin: P001..P200 are Leigh's list, verbatim, and record no origin. A point
# contributed from another source (an external capability such as GARE, ADR
# 0005) is numbered past P200 and records where it came from:
#   origin: {source: GARE, ref: "<document, path or commit>", author: "<name>"}
points:
  - id: P001
    text: >-
      Evolve TER from a Token Efficiency Ratio calculator into a
      software-centric Lean analysis platform for agentic software
      engineering.
    level: L2
    kind: principle
    status: partial
    definition_of_done:
      - >-
        The ter package ships the Lean model (activity classes, value
        stream, waste taxonomy) in ter.domain.
      - ter analyze reports Lean measures next to TER for every session.
    rules: [TER-LEN-001, TER-LEN-007]
    verification:
      - 'planned: passing tests tagged req for TER-LEN-001, TER-LEN-007'

  - id: P002
    text: >-
      Treat an AI coding session as an observable software-development
      process rather than merely a sequence of model tokens.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        Every session is represented as an ordered value stream of ter.event
        events from intent to verified change.
    rules: [TER-LEN-007]
    verification:
      - 'test: tests/golden/test_event_stream_snapshot.py'
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_value_stream_has_every_stage_in_order'

  - id: P003
    text: >-
      Make value, waste, flow, quality, cost, risk, and outcome first-class
      analytical concepts.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        The scorecard has value, waste, flow, quality, cost, risk and
        outcome as named fields.
      - >-
        Each field is computed from recorded events and documented in
        docs/ter4.
    rules: [TER-SCR-001, TER-LEN-002, TER-SCR-004]
    verification:
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_the_scorecard_has_six_separate_dimensions'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_the_outcome_dimension_shows_the_verdict_when_supplied'
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_scorecard_dimensions_and_explained_composite'
      - 'test: tests/unit/test_ter4_outcome.py::test_the_verdict_sits_beside_an_unchanged_scorecard'

  - id: P004
    text: >-
      Preserve TER as the foundational efficiency metric while building a
      broader analytical model around it.
    level: L0
    kind: principle
    status: done
    definition_of_done:
      - >-
        TER 3 scores on the golden corpus are unchanged by every TER 4
        change.
      - Every TER 4 scorecard still reports the Token Efficiency Ratio.
    rules: [TER-ANL-000, TER-ANL-002, TER-SCR-003, TER-ANL-012]
    verification:
      - 'test: tests/golden/test_ter3_characterisation.py'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_software_value_efficiency_sits_next_to_ter'
      - 'ci: L0 gate (golden TER 3 parity, port contracts, architecture)'

  - id: P005
    text: >-
      Separate measurement of agent behaviour from judgment about whether
      the resulting software is correct.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        Behaviour measures and outcome judgements are separate scorecard
        dimensions computed by separate modules.
      - No behaviour measure reads an outcome verdict.
    rules:
      - TER-SCR-001
      - TER-SCR-004
      - TER-SCR-005
      - TER-OUT-001
      - TER-OUT-002
      - TER-OUT-003
      - TER-OUT-004
      - TER-OUT-005
      - TER-OUT-006
      - TER-OUT-007
      - TER-OUT-008
    verification:
      - 'test: tests/unit/test_ter4_outcome.py::test_behaviour_measures_are_blind_to_the_outcome_module'
      - 'test: tests/unit/test_ter4_outcome.py::test_the_verdict_sits_beside_an_unchanged_scorecard'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_the_outcome_dimension_shows_the_verdict_when_supplied'
      - 'test: tests/contract/test_outcome_source.py'
      - 'ci: Architecture import contracts'

  - id: P006
    text: >-
      Define value in relation to the developer's requested software
      outcome.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        Value classification takes the current intent's requested outcome as
        input.
      - >-
        A test shows the same event classified differently under two
        intents.
    rules: [TER-LEN-003, TER-LEN-009]
    verification:
      - 'test: tests/unit/test_ter4_lean_intent.py::test_the_same_edit_is_valued_against_the_current_intent'
      - 'test: tests/unit/test_ter4_evidence_usage.py::TestOutcomeValue::test_the_same_read_is_valued_against_the_current_intent'

  - id: P007
    text: >-
      Define waste as activity consuming resources without proportionately
      advancing that outcome.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        The waste definition (resource use without proportionate progress
        toward the outcome) is in the Lean model docs.
      - >-
        Each waste class names the resource it consumes and the progress
        signal it lacks.
    rules: [TER-LEN-003, TER-LEN-009]
    verification:
      - 'test: tests/unit/test_ter4_lean_properties.py::test_findings_are_traceable_and_bounded'
      - 'test: tests/unit/test_ter4_lean_intent.py::test_the_same_edit_is_valued_against_the_current_intent'
      - 'test: tests/unit/test_ter4_evidence_usage.py::TestOutcomeValue'

  - id: P008
    text: >-
      Recognise that additional reasoning is not automatically waste.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        A reasoning span that introduces new evidence or a decision is never
        labelled waste, shown by tests.
    rules: [TER-LEN-004]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedReasoning'
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestExcessivePlanning'

  - id: P009
    text: >-
      Recognise that fewer tokens are not automatically more efficient.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        No efficiency score improves from token reduction alone; a test
        holds value constant and cuts tokens without changing the verdict.
    rules: [TER-LEN-005]
    verification:
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_cutting_tokens_at_constant_value_changes_no_efficiency_judgement'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_fewer_tokens_without_value_are_not_more_efficient'

  - id: P010
    text: >-
      Optimise for effective software delivery rather than token
      minimisation.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - >-
        Efficiency is reported as value delivered per resource, and the
        report names token minimisation as a non-goal.
    rules: [TER-LEN-005]
    verification:
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_fewer_tokens_without_value_are_not_more_efficient'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_the_report_names_token_minimisation_as_a_non_goal'

  - id: P011
    text: >-
      Establish a formal Lean model for agentic software development.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        docs/ter4 contains the formal Lean model: concepts, definitions and
        their measures.
      - Each concept in the model maps to code in ter.domain.
    rules: [TER-LEN-001, TER-LEN-006]
    verification:
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_every_event_gets_a_stage_and_classified_basis'
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_detectors_are_plugins'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_every_lean_concept_maps_to_measures_the_code_computes'

  - id: P012
    text: >-
      Map Lean concepts such as value, flow, pull, WIP, queues, rework,
      defects, waiting, over-processing, and motion onto agent behaviour.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        Each of value, flow, pull, WIP, queues, rework, defects, waiting,
        over-processing and motion has a named measure.
      - >-
        A table in the Lean model docs links each concept to its detector or
        metric.
    rules: [TER-LEN-006]
    verification:
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_every_lean_concept_maps_to_measures_the_code_computes'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_the_lean_concept_map_is_in_the_a3_and_the_docs'

  - id: P013
    text: >-
      Define an Agentic Value Stream representing the path from developer
      intent to verified software change.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        An AgenticValueStream domain type spans stated intent to verified
        change.
      - Reports show the stream as ordered stages.
    rules: [TER-LEN-007, TER-RPT-003, TER-RPT-004]
    verification:
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_value_stream_has_every_stage_in_order'
      - 'test: tests/unit/test_ter4_a3.py::test_charts_and_empty_states'

  - id: P014
    text: >-
      Model prompts, reasoning, tool calls, repository reads, edits, tests,
      validation, and responses as events within that value stream.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        Prompts, reasoning, tool calls, reads, edits, tests, validation and
        responses each have an event kind in the stream.
    rules: [TER-LEN-007]
    verification:
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_every_event_gets_a_stage_and_classified_basis'
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_shell_intent'

  - id: P015
    text: >-
      Identify value-adding, necessary non-value-adding, and avoidable
      activities.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        Every scored event carries exactly one of value-adding, necessary
        non-value-adding or avoidable.
    rules: [TER-LEN-001]
    verification:
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_every_event_gets_a_stage_and_classified_basis'

  - id: P016
    text: >-
      Measure the proportion of agent activity associated with each activity
      class.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        Reports show the token and time share of each activity class,
        summing to 100%.
    rules: [TER-LEN-002]
    verification:
      - 'test: tests/unit/test_ter4_lean_properties.py::test_findings_are_traceable_and_bounded'
      - 'test: tests/unit/test_ter4_lean_analysis.py::test_confident_waste_is_avoidable_and_uncertain_is_kept_apart'

  - id: P017
    text: >-
      Detect repeated reasoning that does not introduce new evidence or
      decisions.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags reasoning that repeats earlier reasoning with no
        new evidence or decision.
      - Findings cite the repeated and the original event ids.
    rules: [TER-DET-002, TER-LEN-004]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedReasoning'
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedReasoning::test_reasoning_that_uses_new_evidence_is_not_waste'

  - id: P018
    text: >-
      Detect repeated repository exploration that does not improve
      understanding.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags repeated repository exploration that adds no new
        files or facts.
    rules: [TER-DET-002]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedExploration'

  - id: P019
    text: >-
      Detect repeated tool calls whose inputs and outputs are materially
      unchanged.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags tool calls whose inputs and outputs repeat an
        earlier call above the similarity threshold.
    rules: [TER-DET-002]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedToolCall'

  - id: P020
    text: >-
      Detect unnecessary regeneration or rewriting of already satisfactory
      work.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags regeneration of output that an earlier event
        already delivered and nothing rejected.
    rules: [TER-DET-002]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRegeneration'

  - id: P021
    text: >-
      Detect excessive context acquisition.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags context acquisition above the configured band
        before an edit.
    rules: [TER-DET-003]
    verification:
      - 'test: tests/unit/test_ter4_lean_context_motion_waiting.py::TestExcessiveContext'

  - id: P022
    text: >-
      Detect insufficient context acquisition before implementation.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - A detector flags edits made with context below the configured band.
    rules: [TER-DET-003]
    verification:
      - 'test: tests/unit/test_ter4_lean_context_motion_waiting.py::TestInsufficientContext'
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestPrematureImplementation'

  - id: P023
    text: >-
      Detect premature implementation before relevant evidence has been
      collected.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A phase rule flags implementation that starts before the evidence
        the task needs has been read.
    rules: [TER-DET-005]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestPrematureImplementation'

  - id: P024
    text: >-
      Detect excessive planning without transition to implementation.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A phase rule flags planning that exceeds its configured length
        without an edit.
    rules: [TER-DET-005]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestExcessivePlanning'

  - id: P025
    text: >-
      Detect excessive implementation without validation.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A phase rule flags implementation that exceeds its configured length
        without a test or validation event.
    rules: [TER-DET-005]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestUnvalidatedImplementation'

  - id: P026
    text: >-
      Detect repeated edit-test-fail cycles indicative of rework.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags repeated edit, test, failure cycles on the same
        files as rework.
    rules: [TER-DET-006]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestReworkVersusIteration'

  - id: P027
    text: >-
      Detect fragmented edits where a coherent change is unnecessarily
      decomposed.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags a logical change split into more edits than the
        configured limit.
    rules: [TER-DET-007]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestFragmentedEdits'

  - id: P028
    text: >-
      Detect unnecessary file traversal as agentic motion waste.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags file traversals whose content no later event uses,
        as motion waste.
    rules: [TER-DET-007]
    verification:
      - 'test: tests/unit/test_ter4_lean_context_motion_waiting.py::TestUnusedTraversal'
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestFragmentedEdits'

  - id: P029
    text: >-
      Detect unnecessary handoffs between subagents or models.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags subagent handoffs that return no evidence the
        parent uses.
    rules: [TER-DET-008]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestUnnecessaryHandoff'
      - 'test: tests/unit/test_ter4_lean_context_motion_waiting.py::TestFailedRoute'

  - id: P030
    text: >-
      Detect waiting caused by avoidable external-model escalation.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A detector flags external-model escalations whose waiting time
        bought no new evidence.
    rules: [TER-DET-008, TER-DET-011]
    verification:
      - 'test: tests/unit/test_ter4_lean_context_motion_waiting.py::TestFailedRoute'
      - 'test: tests/unit/test_ter4_unearned_escalation.py::TestRecordedEscalation'
      - 'test: tests/unit/test_ter4_unearned_escalation.py::TestReattemptOnAnotherModel'

  - id: P031
    text: >-
      Model work-in-progress within an agent session.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        The domain models open work items (hypotheses, tasks, edits,
        failures) per session.
    rules: [TER-WIP-001]
    verification:
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_wip_is_reported_after_every_event_with_its_peak_and_open_items'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_wip_live_equals_batch_and_ignores_redelivery'

  - id: P032
    text: >-
      Measure concurrent unresolved hypotheses, tasks, edits, and failures.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - Reports show WIP over the session and its peak.
    rules: [TER-WIP-001]
    verification:
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_the_a3_shows_wip_over_the_session_and_its_peak'
      - 'test: tests/unit/test_ter4_wip_scorecard.py::test_hypotheses_open_on_exploration_and_resolve_on_action_or_turn_end'

  - id: P033
    text: >-
      Investigate whether excessive agentic WIP correlates with lower
      efficiency or poorer outcomes.
    level: L6
    kind: research
    status: not-started
    issue: 44
    real_data: true
    definition_of_done:
      - >-
        A study reports the correlation between WIP and efficiency and
        outcomes on the value stream dataset.
    rules: [TER-RSH-001, TER-EXP-010]
    verification:
      - 'planned: study notebook over the TER-RSH-001 dataset'
      - 'planned: real-data verification in issue #44'

  - id: P034
    text: >-
      Detect context inventory accumulating without subsequent use.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - Reports list retrieved context that no later event used.
    rules: [TER-DET-004]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestUnusedContext'
      - 'test: tests/unit/test_ter4_context_cost.py::TestContextInventory'

  - id: P035
    text: >-
      Quantify the cost of unused retrieved context.
    level: L2
    kind: capability
    status: partial
    issue: 40
    real_data: true
    definition_of_done:
      - Reports give the token cost of unused context.
    rules: [TER-DET-004, TER-ANL-040, TER-ANL-041]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestUnusedContext'
      - 'test: tests/unit/test_ter4_context_cost.py::TestContextInventory'
      - 'test: tests/unit/test_ter4_context_cost.py::TestInventoryCost'
      - 'test: tests/unit/test_ter4_context_cost.py::TestDatedPricing'
      - 'test: tests/unit/test_ter4_context_cost.py::TestEstimatedCosts'
      - 'test: tests/contract/test_price_book.py::test_the_latest_entry_not_after_the_date_wins'
      - 'planned: real-data verification in issue #40 (reconcile with real billing)'

  - id: P036
    text: >-
      Quantify the cost of context repeatedly re-read because useful
      knowledge was not retained.
    level: L2
    kind: capability
    status: partial
    issue: 40
    real_data: true
    definition_of_done:
      - Reports give the token cost of context read more than once.
    rules: [TER-DET-004, TER-ANL-040, TER-ANL-041]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedExploration::test_rereading_unchanged_file'
      - 'test: tests/unit/test_ter4_context_cost.py::TestContextInventory::test_reads_after_the_first_are_reread_tokens'
      - 'test: tests/unit/test_ter4_context_cost.py::TestInventoryCost'
      - 'test: tests/unit/test_ter4_context_cost.py::TestDatedPricing'
      - 'test: tests/unit/test_ter4_context_cost.py::TestEstimatedCosts'
      - 'planned: real-data verification in issue #40 (reconcile with real billing)'

  - id: P037
    text: >-
      Distinguish productive iteration from rework.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        Iteration that changes approach or adds evidence is labelled
        productive; same-surface repeats are labelled rework, shown by tests
        on both.
    rules: [TER-DET-006]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestReworkVersusIteration'
      - 'test: tests/golden/test_lean_snapshots.py'

  - id: P038
    text: >-
      Distinguish exploration required by uncertainty from aimless
      exploration.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        Exploration linked to a recorded open question is labelled
        uncertainty-driven; other exploration is labelled intent-directed
        when it names the prompt in force, and aimless otherwise.
    rules: [TER-DET-009]
    verification:
      - 'test: tests/unit/test_ter4_lean_context_motion_waiting.py::TestExplorationDrivers'

  - id: P039
    text: >-
      Distinguish validation activity from duplicated validation.
    level: L2
    kind: capability
    status: done
    definition_of_done:
      - >-
        A second validation with no intervening change is labelled
        duplicated validation.
    rules: [TER-DET-010]
    verification:
      - 'test: tests/unit/test_ter4_lean_detectors.py::TestRepeatedToolCall::test_timing_noise_does_not_make_output_different'

  - id: P040
    text: >-
      Make every waste classification traceable to observable evidence.
    level: L2
    kind: principle
    status: done
    definition_of_done:
      - Every waste finding cites at least one event id.
      - >-
        A lint or test fails for any detector that emits a finding without
        evidence.
    rules: [TER-ANL-020, TER-DET-001]
    verification:
      - 'test: tests/unit/test_ter4_lean_properties.py::test_findings_are_traceable_and_bounded'

  - id: P041
    text: >-
      Retain TER's span-level provenance and stable identities as core
      architectural primitives.
    level: L0
    kind: principle
    status: done
    definition_of_done:
      - Event ids are content-derived and stable across runs and versions.
    rules: [TER-SRC-004]
    verification:
      - 'test: tests/unit/test_ter4_domain.py::TestEventIds::test_ids_are_frozen_across_versions'

  - id: P042
    text: >-
